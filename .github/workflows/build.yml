  # left out of automation. steamcmd requires an interactive Steam Guard
  # login (a one-time code sent to your phone/email) the first time it runs
  # under a new machine/CI identity, which can't be scripted headlessly
  # without either disabling Steam Guard (not recommended) or setting up
  # steamcmd's persistent login cache out-of-band. Set this up manually:
  #   1. Write app_build.vdf / depot_build.vdf describing your Steam app
  #      and depots (see https://partner.steamgames.com/doc/sdk/uploading).
  #   2. Run `steamcmd +login <user> +run_app_build app_build.vdf +quit`
  #      once locally/interactively to authorize this machine and cache
  #      credentials (~/Steam/config/config.vdf).
  #   3. Only then can a CI job reuse those cached credentials as a
  #      GitHub Actions secret to run steamcmd non-interactively.
