name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: godot-project-1

jobs:
  export-linux:
    name: Linux Export (Steam Deck target)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # The fluid solve runs as compute shaders, and Godot compiles .glsl to
      # SPIR-V through a real rendering device. A headless import cannot do it
      # ("Cannot import custom .glsl shaders when running in headless mode")
      # and silently leaves the project with no solve at all. lavapipe gives
      # the container a software Vulkan device to compile against.
      - name: Install a software Vulkan device
        run: |
          apt-get update -qq
          apt-get install -y -qq mesa-vulkan-drivers xvfb

      - name: Import project
        run: xvfb-run -a godot --import || true

      # An unimported .glsl leaves a valid=false stub and no .res, which no
      # later step notices — the build succeeds and ships a dead tank.
      - name: Verify the compute shaders compiled
        run: |
          count=$(ls .godot/imported/ | grep -c '\.glsl-.*\.res$' || true)
          if [ "$count" -lt 6 ]; then
            echo "Expected 6 compiled compute shaders in .godot/imported/, found $count."
            exit 1
          fi
          echo "Compiled $count compute shaders."

      - name: Export
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Linux/X11" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # The fluid solve runs as compute shaders, and Godot compiles .glsl to
      # SPIR-V through a real rendering device. A headless import cannot do it
      # ("Cannot import custom .glsl shaders when running in headless mode")
      # and silently leaves the project with no solve at all. lavapipe gives
      # the container a software Vulkan device to compile against.
      - name: Install a software Vulkan device
        run: |
          apt-get update -qq
          apt-get install -y -qq mesa-vulkan-drivers xvfb

      - name: Import project
        run: xvfb-run -a godot --import || true

      # An unimported .glsl leaves a valid=false stub and no .res, which no
      # later step notices — the build succeeds and ships a dead tank.
      - name: Verify the compute shaders compiled
        run: |
          count=$(ls .godot/imported/ | grep -c '\.glsl-.*\.res$' || true)
          if [ "$count" -lt 6 ]; then
            echo "Expected 6 compiled compute shaders in .godot/imported/, found $count."
            exit 1
          fi
          echo "Compiled $count compute shaders."

      - name: Export
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  # Deploys the Linux build to itch.io via butler. Only runs on tag pushes
  # (releases), not on every push to main.
  deploy-itch:
    name: Deploy Linux build to itch.io
    needs: export-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler
          chmod +x butler/butler

      - name: Push build to itch.io
        env:
          # Add BUTLER_API_KEY as a repository secret in
          # Settings -> Secrets and variables -> Actions before tagging a
          # release. Get the key from https://itch.io/user/settings/api-keys
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # TODO: replace with your actual itch.io username/game-slug
          ./butler/butler push build/linux "your-itch-username/godot-project-1:linux" \
            --userversion "${{ github.ref_name }}"

  export-macos:
    name: macOS Export
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        run: |
          curl -L -o Godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_macOS.universal.${GODOT_VERSION}-stable.zip"
          unzip -o Godot.zip -d /Applications/
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

      - name: Install export templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/
          curl -L -o templates.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/template_${GODOT_VERSION}-stable.zip"
          unzip -o templates.zip -d ~/Library/Application\ Support/Godot/export_templates/

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import || true

      - name: Verify the compute shaders compiled
        run: |
          count=$(ls .godot/imported/ | grep -c '\.glsl-.*\.res$' || true)
          if [ "$count" -lt 6 ]; then
            echo "Expected 6 compiled compute shaders in .godot/imported/, found $count."
            exit 1
          fi
          echo "Compiled $count compute shaders."

      - name: Export
        run: |
          mkdir -p build/macos
          "$GODOT_BIN" --headless --verbose --export-release "macOS" "build/macos/$EXPORT_NAME.zip"

      - name: Unzip export
        run: |
          mkdir -p build/macos/staged
          if [ -f "build/macos/$EXPORT_NAME.zip" ]; then
            unzip -o "build/macos/$EXPORT_NAME.zip" -d build/macos/staged
            # Godot's macOS export puts the .app inside a nested folder sometimes
            app=$(find build/macos/staged -name "*.app" -type d | head -n 1)
            if [ -n "$app" ]; then
              mv "$app" build/macos/
            fi
          fi
          # Copy any .pck data file alongside the .app
          pck=$(find build/macos -maxdepth 1 -name "*.pck" | head -n 1)
          if [ -n "$pck" ]; then
            mv "$pck" build/macos/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos

  # ──────────────────────────────────────────────────────────────────────
  # Steam deployment — runs only on tag pushes (releases)
  #
  # Steam Guard setup (one-time, on any machine):
  #   1. Install steamcmd:  sudo apt install steamcmd   (Linux)
  #                        brew install --cask steamcmd  (macOS)
  #   2. Login once:       steamcmd +login "<user>" +quit
  #      Enter password + Steam Guard code when prompted.
  #   3. Copy config.vdf:
  #      Linux:  ~/.steam/steam/config/config.vdf
  #      macOS:  ~/Library/Application Support/Steam/config/config.vdf
  #   4. Set as GitHub secret: STEAM_CONFIG_VDF
  #      Also set: STEAM_USERNAME
  # ──────────────────────────────────────────────────────────────────────

  deploy-steam:
    name: Deploy to Steam
    needs: [export-linux]  # Add export-macos when macOS preset exists
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux

      # ── Uncomment when macOS depot is ready ──
      # - name: Download macOS artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: macos
      #     path: build/macos

      - name: Package builds for Steam
        run: |
          chmod +x scripts/build-for-steam.sh
          ./scripts/build-for-steam.sh linux build/linux build/steam/linux

      # ── Uncomment when macOS depot is ready ──
      # ./scripts/build-for-steam.sh macos build/macos build/steam/macos

      - name: Install steamcmd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq steamcmd

      - name: Restore Steam credentials
        run: |
          mkdir -p ~/.steam/steam/config
          echo "$STEAM_CONFIG_VDF" > ~/.steam/steam/config/config.vdf
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}

      - name: Upload to Steam
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          steamcmd +login "$STEAM_USERNAME" \
            +run_app_build steam/app_build.vdf \
            +quit
