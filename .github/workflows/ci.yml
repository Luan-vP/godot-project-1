name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.4.1

# Only our own GDScript is linted/formatted — addons/ holds vendored
# third-party code (GUT) that doesn't follow our style and isn't ours
# to reformat.
jobs:
  lint:
    name: Lint (gdformat + gdlint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: gdformat --check
        run: gdformat --check autoload core features resources tests

      - name: gdlint
        run: gdlint autoload core features resources tests

  test:
    name: Test (GUT headless)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # GUT resolves its own types (GutTest, GutUtils, ...) through Godot's
      # global class_name registry, which only exists once the project has been
      # imported. Without this it aborts before collecting a single test — and
      # Godot still exits 0, so the job reports green having tested nothing.
      - name: Import project
        run: godot --headless --import || true

      - name: Verify the import produced a class cache
        run: |
          if [ ! -f .godot/global_script_class_cache.cfg ]; then
            echo "Import produced no .godot/global_script_class_cache.cfg."
            echo "GUT would abort before running any tests."
            exit 1
          fi

      - name: Run GUT test suite
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests -gexit -gjunit_xml_file=res://gut_results.xml

      # A run that collects nothing still exits 0, which is exactly how this
      # job passed while doing nothing. Assert that tests were actually run.
      - name: Verify tests actually ran
        run: |
          if [ ! -f gut_results.xml ]; then
            echo "GUT produced no results file."
            exit 1
          fi
          if ! grep -q "<testcase" gut_results.xml; then
            echo "GUT collected no tests:"
            cat gut_results.xml
            exit 1
          fi
          echo "Ran $(grep -c "<testcase" gut_results.xml) test cases."
