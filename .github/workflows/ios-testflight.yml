name: TestFlight

# Builds the given commit for iOS and uploads it to TestFlight, through
# scripts/build-ios.sh --release, the same script as a release from a desk.
# Called by deploy.yml (every passing push to main) and by testflight-pr.yml
# (a `/testflight` comment on a pull request). The secrets it needs are listed
# in the README, under "Deploying from CI".
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        required: true
        type: string

env:
  GODOT_VERSION: 4.4.1

jobs:
  testflight:
    name: TestFlight
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true

      # App Store Connect only takes builds made with the current SDK.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-ios-${{ env.GODOT_VERSION }}

      # The whole set is over a gigabyte; only the iOS template is kept.
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$dir"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/ios.zip templates/version.txt -d "$dir"
          rm "$RUNNER_TEMP/templates.tpz"

      # Xcode's automatic signing would make a new development certificate on
      # every clean runner, so the archive is left unsigned and the upload
      # signs it with the team's distribution certificate, from a keychain
      # that lives for this job. The API key stands in for Xcode's signed-in
      # account.
      - name: Install the signing certificate and API key
        env:
          CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s\n' "$API_KEY" > "$key"
          echo "APP_STORE_CONNECT_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The script imports the project first; the compute shaders compile only
      # with a window, which the runner's logged-in session gives it.
      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/build-ios.sh --release --no-install

      # Printed rather than uploaded: the repository is public, and the log
      # here has its secrets masked.
      - name: Show the export log
        if: failure()
        run: cat builds/ios-release-export.log || true

      - name: Remove the keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
